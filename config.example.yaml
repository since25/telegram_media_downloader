api_hash: your_api_hash
api_id: your_api_id
bot_token: your_bot_token
resource_bot_token: your_resource_bot_token
# Private staging channel where the resource Bot is an administrator.
resource_staging_chat_id: -1001234567890
chat:
- chat_id: telegram_chat_id
  last_read_message_id: 0
file_formats:
  audio:
  - all
  document:
  - all
  video:
  - all
file_path_prefix:
- chat_title
- media_datetime
media_types:
- audio
- photo
- video
- document
- voice
- video_note
enable_web: false
web_host: 0.0.0.0
web_port: 5000
# web_login_secret: set-a-strong-unique-password
# Set true only when the Web console is served over HTTPS.
web_secure_cookie: false
mcp:
  enabled: false
channel_library:
  # Packages wait until their full known size fits while this much free disk remains.
  min_free_disk_bytes: 3221225472
  full_scan_batch_size: 50
  full_scan_delay_min_sec: 4
  full_scan_delay_max_sec: 6
  incremental_scan_batch_size: 50
  incremental_scan_delay_min_sec: 1
  incremental_scan_delay_max_sec: 2
  transient_retry_delays_sec: [5, 15, 45]
# cloud upload (rclone). upload_timeout_sec raises the per-file hard deadline;
# rclone_transfers caps connections per rclone process; max_upload_concurrency
# caps how many rclone processes may run at once to protect the remote link.
upload_drive:
  enable_upload_file: true
  upload_adapter: rclone
  rclone_path: /usr/bin/rclone
  remote_dir: your_rclone_remote:/telegram
  before_upload_file_zip: false
  after_upload_file_delete: true
  upload_timeout_sec: 7200
  rclone_transfers: 1
  max_upload_concurrency: 2
# in linux please use /
# save_path: E:\github\telegram_media_downloader
