version: "3.3"

services:
  telegram_media_downloader:
    image: tangyoha/telegram_media_downloader:latest
    build: .
    ports:
      # Here is what you need to edit
      - "5000:5000"
    #environment:
    #  - http_proxy=http://192.168.101.30:10811
    #  - https_proxy=http://192.168.101.30:10811
    environment:
      TMD_TASK_DB_PATH: /app/state/web_tasks.sqlite3
      TMD_CHANNEL_LIBRARY_DB_PATH: /app/state/channel_library.sqlite3
      TMD_RESOURCE_BOT_DB_PATH: /app/state/resource_bot.sqlite3
      TMD_WEB_AUTH_FILE: /app/state/.web_auth.json
    volumes:
      # Here is what you need to edit
      - "./downloads/:/app/downloads/"

      # Rclone
      - "$HOME/.config/rclone/:$HOME/.config/rclone/"

      # The following is what you don't need to edit
      - "./config.yaml:/app/config.yaml"
      - "./data.yaml:/app/data.yaml"
      - "./log/:/app/log/"
      - "./sessions/:/app/sessions"
      - "./temp/:/app/temp"
      - "./state/:/app/state/"
    #restart: "unless-stopped"
# volumes:
#   sessions:
#   temp:
